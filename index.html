<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f6f1e8">
<title>聚餐候选餐厅</title>
<style>
  :root{
    --bg:#f6f1e8; --card:#fffdf9; --ink:#2a2622; --muted:#8a8178; --line:#e7dfd2;
    --green:#1f5c3a; --star:#f2a33a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}

  header{padding:4px 4px 14px}
  h1{font-size:26px;margin:0;letter-spacing:.02em}

  /* ---------- radar map ---------- */
  .map{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 6px 24px rgba(80,60,30,.07);aspect-ratio:1/1;overflow:hidden}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .ring{fill:none;stroke:#d9cfbf;stroke-dasharray:3 5}
  .ring.outer{stroke:#cbbfac;stroke-dasharray:none}
  .axis{stroke:#ece4d7}
  .ringlbl{font-size:12px;fill:#a89d8f}
  .ray{stroke-width:1.6;stroke-dasharray:4 5;opacity:.45;transition:opacity .2s}
  .ray.on{opacity:1;stroke-dasharray:none;stroke-width:2.2}
  .north text{font-size:13px;font-weight:600;fill:#7a6f63}

  .pt{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;
    font:inherit;color:inherit}
  .dot{display:block;width:18px;height:18px;border-radius:50%;background:var(--c);
    border:3px solid #fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent),0 2px 6px rgba(0,0,0,.18);
    transition:transform .2s}
  .pt.on .dot,.pt:hover .dot{transform:scale(1.25)}
  .pt.on .dot{animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent),0 2px 6px rgba(0,0,0,.18)}
    100%{box-shadow:0 0 0 14px transparent,0 2px 6px rgba(0,0,0,.18)}}
  .tag{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:10px;
    padding:3px 8px 3px;line-height:1.25;text-align:left;box-shadow:0 2px 8px rgba(80,60,30,.08)}
  .tag b{display:block;font-size:13px}
  .tag small{font-size:11px;color:var(--c);font-weight:600}
  .pt.r .tag{left:22px} .pt.l .tag{right:22px;text-align:right}
  .pt.b .tag{top:24px;left:50%;transform:translateX(-50%);text-align:center}
  .pt.on .tag{border-color:var(--c)}

  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
  .center i{display:block;margin:0 auto;width:22px;height:22px;border-radius:7px;background:var(--green);
    border:3px solid #fff;box-shadow:0 0 0 7px rgba(31,92,58,.14),0 2px 6px rgba(0,0,0,.2)}
  .center span{position:absolute;left:50%;top:30px;transform:translateX(-50%);white-space:nowrap;
    font-size:13px;font-weight:700;color:var(--green);background:rgba(255,253,249,.85);border-radius:6px;padding:0 4px}

  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin:10px 0 22px}

  /* ---------- list ---------- */
  h2{font-size:16px;margin:0 4px 10px;color:#5a5148}
  .list{display:grid;gap:10px}
  .item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;
    border-left:5px solid var(--c);transition:transform .15s, box-shadow .15s}
  .item:active{transform:scale(.985)}
  .item.on{box-shadow:0 0 0 2px var(--c)}
  .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;
    display:grid;place-items:center;font-weight:700;font-size:14px}
  .meta{flex:1;min-width:0}
  .meta b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
  .cuisine{display:block;font-size:13.5px;font-weight:600;color:var(--c);margin:1px 0 4px}
  .dist{flex:none;align-self:flex-start;margin-top:4px;font-size:12px;color:var(--muted);white-space:nowrap}

  .stars{position:relative;display:inline-block;font-size:13px;letter-spacing:1px;color:#e4dccf;line-height:1}
  .stars::before{content:"★★★★★"}
  .stars span{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star)}
  .stars span::before{content:"★★★★★"}
  .score{color:#e2762b;font-weight:700}

  /* ---------- bottom sheet ---------- */
  .mask{position:fixed;inset:0;background:rgba(30,24,18,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;
    background:var(--card);border-radius:22px 22px 0 0;z-index:11;transform:translateY(calc(100% + 40px));visibility:hidden;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;padding:0 0 calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 30px rgba(0,0,0,.15)}
  .open .mask{opacity:1;pointer-events:auto}
  .open .sheet{transform:none;visibility:visible}
  .grab{width:40px;height:5px;border-radius:3px;background:#d8cfc2;margin:9px auto 10px}
  .close{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;border:0;
    background:#f0e9de;color:#6b6157;font-size:20px;line-height:34px;cursor:pointer}
  .s-body{padding:0 18px}
  .s-head{display:flex;gap:10px;align-items:flex-start;padding-right:38px}
  .s-head .num{margin-top:3px}
  .s-head h3{margin:0;font-size:18px;line-height:1.35}
  .s-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .chip{font-size:12px;border-radius:999px;padding:2px 10px;background:#f2ece2;color:#6b6157}
  .chip.c{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-weight:600}
  .shot{display:block;width:100%;padding:0;cursor:zoom-in;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#eee}
  .shot img{display:block;width:100%;height:auto}
  .viewer{position:fixed;inset:0;z-index:20;background:#111;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
  .viewer.open{display:flex;align-items:center}
  .viewer img{display:block;width:max(200vw,980px);max-width:none;height:auto;margin:auto 0;flex:none}
  .viewer span{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:rgba(255,255,255,.14);color:#eee;font-size:12px;border-radius:999px;padding:5px 12px;white-space:nowrap}
  .zoom{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 12px}
  .addr{display:flex;gap:8px;font-size:14px;background:#faf6ef;border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .addr svg{flex:none;margin-top:3px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:14px;
    background:#ff6633;color:#fff;font-weight:700;font-size:16px;text-decoration:none;
    box-shadow:0 6px 16px rgba(255,102,51,.28)}
  .btn:active{transform:scale(.985)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>聚餐候选餐厅</h1>
  </header>

  <div class="map" id="map">
    <svg viewBox="-300 -300 600 600" aria-hidden="true">
      <line class="axis" x1="-300" y1="0" x2="300" y2="0"/>
      <line class="axis" x1="0" y1="-300" x2="0" y2="300"/>
      <g id="rings"></g>
      <g id="rays"></g>
      <g class="north" transform="translate(262,-262)">
        <circle r="20" fill="#fff" stroke="#e1d8ca"/>
        <path d="M0,-13 L6,4 L0,0 L-6,4 Z" fill="#c0392b"/>
        <text y="16" text-anchor="middle">北</text>
      </g>
    </svg>
    <div class="center"><i></i><span>北京林业大学</span></div>
  </div>
  <p class="hint">👆 点击地图上的圆点或下方卡片，查看餐厅详情</p>

  <h2>按距离排序</h2>
  <div class="list" id="list"></div>
</div>

<div class="viewer" id="viewer"><img alt="大图"><span>点击任意处关闭 · 可左右滑动 / 双指缩放</span></div>

<div id="pop">
  <div class="mask" id="mask"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">
    <div class="grab"></div>
    <button class="close" id="close" aria-label="关闭">×</button>
    <div class="s-body" id="s-body"></div>
  </div>
</div>

];

const kx = 111.32*Math.cos(CENTER.lat*Math.PI/180), ky = 110.95;
SHOPS.forEach(s=>{
  s.dx = (s.lng-CENTER.lng)*kx; s.dy = (s.lat-CENTER.lat)*ky;
  s.km = Math.hypot(s.dx,s.dy);
});
SHOPS.sort((a,b)=>a.km-b.km);
SHOPS.forEach((s,i)=>s.no=i+1);

const svgNS='http://www.w3.org/2000/svg', k = MAP_R/R_KM;
const el=(tag,attrs)=>{const e=document.createElementNS(svgNS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);return e};
const rings=document.getElementById('rings'), rays=document.getElementById('rays');
[0.5,1,1.5,2,2.5].forEach(r=>{
  rings.appendChild(el('circle',{r:r*k,class:'ring'+(r===R_KM?' outer':'')}));
  const t=el('text',{x:6,y:-r*k+15,class:'ringlbl'}); t.textContent=r+' km'; rings.appendChild(t);
});

const map=document.getElementById('map'), list=document.getElementById('list');
const fmt=km=>'约 '+km.toFixed(1)+' km';
const stars=r=>`<span class="stars"><span style="width:${r/5*100}%"></span></span>`;

SHOPS.forEach(s=>{
  const x=s.dx*k, y=-s.dy*k;
  const ray=el('line',{x1:0,y1:0,x2:x,y2:y,class:'ray',stroke:s.color}); ray.id='ray-'+s.id; rays.appendChild(ray);

  const b=document.createElement('button');
  b.className='pt '+s.side; b.id='pt-'+s.id; b.style.setProperty('--c',s.color);
  b.style.left=(50+x/6)+'%'; b.style.top=(50+y/6)+'%';
  b.setAttribute('aria-label',s.name);
  b.innerHTML=`<i class="dot"></i><span class="tag"><b>${s.short}</b><small>${s.km.toFixed(1)} km</small></span>`;
  b.onclick=()=>open(s); map.appendChild(b);

  const c=document.createElement('button');
  c.className='item'; c.id='it-'+s.id; c.style.setProperty('--c',s.color);
  c.innerHTML=`<span class="num">${s.no}</span>
    <span class="meta"><b>${s.short}</b>
      <span class="cuisine">${s.cuisine}</span>
      <span class="row">${stars(s.rating)}<span class="score">${s.rating}</span></span></span>
    <span class="dist">${s.km.toFixed(1)} km</span>`;
  c.onclick=()=>open(s); list.appendChild(c);
});

const pop=document.getElementById('pop'), body=document.getElementById('s-body');
function highlight(id){
  document.querySelectorAll('.pt,.item,.ray').forEach(e=>e.classList.remove('on'));
  if(!id) return;
  ['pt-','it-','ray-'].forEach(p=>document.getElementById(p+id).classList.add('on'));
}
function open(s){
  highlight(s.id);
  body.style.setProperty('--c',s.color);
  body.innerHTML=`
    <div class="s-head"><span class="num">${s.no}</span><h3 id="s-title">${s.name}</h3></div>
    <div class="s-tags">
      <span class="chip">${stars(s.rating)} <span class="score">${s.rating}</span></span>
      <span class="chip c">${s.cuisine}</span><span class="chip">${s.area}</span>
      <span class="chip">距北林${fmt(s.km)}</span>
    </div>
    <button class="shot" onclick="zoomIn('${s.id}')"><img src="${src(s.id)}" alt="${s.short}店铺信息与推荐菜"></button>
    <div class="zoom">点击图片可查看大图</div>
    <div class="addr"><svg width="16" height="16" viewBox="0 0 24 24" fill="${s.color}"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg><span>${s.addr}</span></div>
    <a class="btn" href="${s.url}" target="_blank" rel="noopener">在大众点评中查看</a>`;
  pop.classList.add('open');
  document.querySelector('.sheet').scrollTop=0;
}
function close(){pop.classList.remove('open');}
const viewer=document.getElementById('viewer');
function zoomIn(id){viewer.querySelector('img').src=src(id);viewer.classList.add('open');viewer.scrollTo(0,0);}
viewer.onclick=()=>viewer.classList.remove('open');
document.getElementById('mask').onclick=close;
document.getElementById('close').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){viewer.classList.remove('open');close()}});
</script>
</body>
